<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>反射軌道ツール・倍率調整／壁保存／ドラッグ角度版</title><style>
:root{color-scheme:dark;font-family:system-ui,'Yu Gothic',sans-serif}*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf2fa}header{padding:12px 18px;border-bottom:1px solid #344155}h1{font-size:19px;margin:0 0 4px}header small{color:#aebbd0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px;height:calc(100dvh - 67px);min-height:450px}.viewer{background:#243145;border:1px solid #41516b;border-radius:10px;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:8px}.viewer canvas{display:block;max-width:none;touch-action:none;cursor:crosshair}.sidebar{background:#1d2a3e;border:1px solid #3a4b63;border-radius:10px;padding:16px;overflow:auto}.group{border-bottom:1px solid #3b4b62;padding-bottom:15px;margin-bottom:15px}.group:last-child{border:0}label{font-size:13px;color:#cad6e8;display:block;margin-bottom:7px}.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:8px 0}button,input{font:inherit}button{background:#30435e;border:1px solid #60728b;border-radius:6px;padding:9px 11px;color:#fff;cursor:pointer}button:hover{background:#415978}button.active{background:#176e50;border-color:#45d59a}button.primary{background:#215d95}button:disabled{opacity:.45;cursor:not-allowed}input[type=number]{background:#111c2d;border:1px solid #64748b;color:white;border-radius:6px;padding:9px;width:105px}input[type=range]{width:100%;accent-color:#fbbf24}input[type=file]{max-width:100%;font-size:12px}.hint{color:#a9b9cf;font-size:12px;line-height:1.6}.value{font-size:23px;font-weight:700;color:#facc15}.status{font-size:12px;color:#b5c8de;line-height:1.6;white-space:pre-wrap}.field{margin:12px 0}.angle-buttons button{flex:1}.inline-label{display:flex;justify-content:space-between;align-items:center}.checkbox{display:flex;gap:7px;align-items:center;font-size:13px}.checkbox input{accent-color:#fbbf24}@media(max-width:800px){.layout{grid-template-columns:1fr;height:auto}.viewer{height:65dvh}.sidebar{overflow:visible}}
</style></head><body><header><h1>スクリーンショット反射軌道ツール</h1><small>画像を貼り付け、壁と発射地点を指定。画像上でドラッグして角度も調整できます。</small></header><main class="layout"><section class="viewer" id="viewer"><canvas id="canvas" width="500" height="700"></canvas></section><aside class="sidebar"><div class="group"><label>スクリーンショット</label><input type="file" id="file" accept="image/*"><div class="row"><button id="paste">クリップボードから貼り付け</button></div><div class="hint">Ctrl + V でも貼り付け可能。画像の縦横比は維持されます。</div></div><div class="group"><label>位置の設定（ボタンを選択して画像をクリック）</label><div class="row"><button id="wall1" data-mode="wall1">壁の左上</button><button id="wall2" data-mode="wall2">壁の右下</button><button id="source" data-mode="source" class="active">発射地点</button><button id="aim" data-mode="aim">角度をドラッグ</button></div><div class="hint">「発射地点」ではクリック・ドラッグで位置を指定。「角度をドラッグ」では画像上の任意の場所からドラッグすると、発射地点からカーソル方向への角度を設定します。青い点は壁の位置です。</div></div><div class="group"><div class="inline-label"><label>発射角度</label><span class="value" id="angleLabel">45.00°</span></div><input id="angleRange" type="range" min="0" max="359.95" step="0.05" value="45"><div class="row"><input id="angleInput" type="number" min="0" max="359.95" step="0.05" value="45.00"><span>°</span></div><div class="row angle-buttons"><button data-step="-1">−1°</button><button data-step="-0.05">−0.05°</button><button data-step="0.05">+0.05°</button><button data-step="1">+1°</button></div><div class="hint">右方向が0°、上方向が90°です。角度ドラッグも0.05°刻みで反映します。</div></div><div class="group"><label>反射回数</label><div class="row"><input type="number" id="bounces" min="0" max="200" step="1" value="8"><button id="reset">位置を初期化</button></div><label class="checkbox"><input id="showReverse" type="checkbox" checked>反対方向に直線を表示（壁を貫通）</label><label class="checkbox"><input id="showBounds" type="checkbox" checked>壁の範囲を表示</label></div><div class="group"><label>画像の表示</label><div class="inline-label"><label for="zoomRange">表示倍率</label><strong id="zoomLabel">55%</strong></div><input id="zoomRange" type="range" min="10" max="200" step="5" value="55"><div class="row"><input id="zoomInput" type="number" min="10" max="200" step="5" value="55"><span>%</span><button id="zoomFit">画面に合わせる</button><button id="zoomReset">55%に戻す</button></div><div class="hint">画像の縦横比は維持されます。大きい画像は左側の表示領域内をスクロールできます。</div></div><div class="group"><button class="primary" id="save">軌道付き画像を保存</button></div><div class="status" id="status">画像を読み込んでください。</div></aside></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d'),viewer=$('viewer');let img=null,mode='source',zoom=0.55,drag=null,aimPointer=null;let bounds={x1:.05,y1:.12,x2:.95,y2:.88},source={x:.5,y:.65};const STORAGE_KEY='reflection-wall-bounds-v1';function saveBounds(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(bounds))}catch(e){status('壁の保存ができません。ブラウザの保存設定を確認してください。')}}function restoreBounds(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved&&['x1','y1','x2','y2'].every(k=>typeof saved[k]==='number'&&Number.isFinite(saved[k])&&saved[k]>=0&&saved[k]<=1))bounds=saved}catch(e){}}restoreBounds();let angle=45,bounces=8;
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function pos(p){return{x:p.x*c.width,y:p.y*c.height}}function point(e){const r=c.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1)}}function setMode(m){mode=m;aimPointer=null;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m))}function status(s){$('status').textContent=s}
function setZoom(pct){const n=Number(pct);if(!Number.isFinite(n))return;zoom=clamp(n,10,200)/100;$('zoomRange').value=String(Math.round(zoom*100/5)*5);$('zoomInput').value=String(Math.round(zoom*100));$('zoomLabel').textContent=Math.round(zoom*100)+'%';try{localStorage.setItem('reflection-zoom-v1',String(zoom*100))}catch(e){}if(img)updateSize()}
function updateSize(){if(!img)return;c.width=img.naturalWidth;c.height=img.naturalHeight;c.style.width=Math.round(c.width*zoom)+'px';c.style.height=Math.round(c.height*zoom)+'px';draw()}

function load(file){if(!file||!file.type.startsWith('image/')){status('画像ファイルを選択してください。');return}const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{img=im;URL.revokeObjectURL(url);updateSize();status('読み込み完了。保存済みの壁の位置を使用しています。必要なら壁を調整してください。')};im.onerror=()=>{URL.revokeObjectURL(url);status('画像を読み込めませんでした。')};im.src=url}
function line(x1,y1,x2,y2,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function dot(x,y,color,r=6){ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#fff';ctx.stroke()}
function draw(){const w=c.width,h=c.height;ctx.clearRect(0,0,w,h);if(img)ctx.drawImage(img,0,0,w,h);else{ctx.fillStyle='#263448';ctx.fillRect(0,0,w,h);ctx.fillStyle='#d5e0ee';ctx.font='22px sans-serif';ctx.fillText('画像を読み込んでください',25,50);return}const a=pos({x:Math.min(bounds.x1,bounds.x2),y:Math.min(bounds.y1,bounds.y2)}),b=pos({x:Math.max(bounds.x1,bounds.x2),y:Math.max(bounds.y1,bounds.y2)}),s=pos(source);if($('showBounds').checked){ctx.strokeStyle='#39a3ff';ctx.lineWidth=Math.max(2,w/500);ctx.setLineDash([Math.max(6,w/100),Math.max(4,w/150)]);ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.setLineDash([]);dot(a.x,a.y,'#39a3ff',Math.max(5,w/180));dot(b.x,b.y,'#39a3ff',Math.max(5,w/180))}dot(s.x,s.y,'#30d99a',Math.max(5,w/180));if(b.x-a.x<2||b.y-a.y<2)return;let x=clamp(s.x,a.x,b.x),y=clamp(s.y,a.y,b.y);const rad=angle*Math.PI/180;let vx=Math.cos(rad),vy=-Math.sin(rad);ctx.lineWidth=Math.max(2,w/250);ctx.lineJoin='round';for(let i=0;i<=bounces;i++){let tx=vx>1e-10?(b.x-x)/vx:vx< -1e-10?(a.x-x)/vx:Infinity;let ty=vy>1e-10?(b.y-y)/vy:vy< -1e-10?(a.y-y)/vy:Infinity;let t=Math.min(tx,ty);if(!Number.isFinite(t)||t< -1e-5)break;const oldX=x,oldY=y;x=clamp(x+vx*t,a.x,b.x);y=clamp(y+vy*t,a.y,b.y);const progress=bounces===0?0:i/bounces;const green=Math.round(255*progress);ctx.strokeStyle=`rgb(255,${green},0)`;ctx.beginPath();ctx.moveTo(oldX,oldY);ctx.lineTo(x,y);ctx.stroke();if(Math.abs(tx-ty)<1e-6){vx=-vx;vy=-vy}else if(tx<ty)vx=-vx;else vy=-vy}
if(aimPointer){ctx.save();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=Math.max(2,w/400);ctx.setLineDash([Math.max(5,w/160),Math.max(4,w/200)]);ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(aimPointer.x*w,aimPointer.y*h);ctx.stroke();ctx.restore()}
if($('showReverse').checked){
  // 反対側は反射させず、画像の端まで一直線に延長する。
  const rx=-Math.cos(rad),ry=Math.sin(rad);
  const ox=s.x,oy=s.y;
  const times=[];
  if(rx>1e-10)times.push((w-ox)/rx);
  if(rx< -1e-10)times.push((0-ox)/rx);
  if(ry>1e-10)times.push((h-oy)/ry);
  if(ry< -1e-10)times.push((0-oy)/ry);
  const tEnd=Math.min(...times.filter(t=>t>=0));
  if(Number.isFinite(tEnd)){
    ctx.save();ctx.globalAlpha=0.5;
    ctx.strokeStyle='#ffb347';ctx.lineWidth=Math.max(2,w/250);
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+rx*tEnd,oy+ry*tEnd);ctx.stroke();
    ctx.restore();
  }
}
}
function setAngle(n){if(!Number.isFinite(n))return;angle=Math.round((((n%360)+360)%360)*20)/20;if(angle>=360)angle=0;$('angleInput').value=angle.toFixed(2);$('angleRange').value=angle;$('angleLabel').textContent=angle.toFixed(2)+'°';draw()}
$('file').addEventListener('change',e=>load(e.target.files[0]));document.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(item){e.preventDefault();load(item.getAsFile())}});$('paste').onclick=async()=>{try{const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type){load(await item.getType(type));return}}status('クリップボードに画像がありません。Ctrl + Vも試してください。')}catch(e){status('ブラウザが直接貼り付けを許可していません。Ctrl + Vを試してください。')}};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));function updateAim(p){const dx=(p.x-source.x)*c.width,dy=(source.y-p.y)*c.height;if(Math.hypot(dx,dy)<2)return;aimPointer=p;setAngle(Math.atan2(dy,dx)*180/Math.PI)}
c.addEventListener('pointerdown',e=>{if(!img)return;const p=point(e);if(mode==='aim'){drag='aim';c.setPointerCapture(e.pointerId);updateAim(p);return}const candidates=[['wall1',{x:bounds.x1,y:bounds.y1}],['wall2',{x:bounds.x2,y:bounds.y2}],['source',source]];let near=candidates.map(([name,q])=>({name,d:Math.hypot((q.x-p.x)*c.width,(q.y-p.y)*c.height)*zoom})).sort((a,b)=>a.d-b.d)[0];drag=near.d<18?near.name:mode;c.setPointerCapture(e.pointerId);movePoint(p)});
function movePoint(p){if(drag==='wall1'){bounds.x1=p.x;bounds.y1=p.y}else if(drag==='wall2'){bounds.x2=p.x;bounds.y2=p.y}else if(drag==='source'){source={...p}}draw()}
c.addEventListener('pointermove',e=>{if(drag==='aim')updateAim(point(e));else if(drag)movePoint(point(e))});
function endDrag(){if(drag==='wall1'||drag==='wall2')saveBounds();drag=null;aimPointer=null;draw()}
c.addEventListener('pointerup',endDrag);c.addEventListener('pointercancel',endDrag);
$('zoomRange').oninput=e=>setZoom(e.target.value);$('zoomInput').onchange=e=>setZoom(e.target.value);$('zoomReset').onclick=()=>setZoom(55);$('zoomFit').onclick=()=>{if(!img)return;const r=viewer.getBoundingClientRect();setZoom(Math.floor(Math.min((r.width-24)/img.naturalWidth,(r.height-24)/img.naturalHeight)*100))};try{const z=Number(localStorage.getItem('reflection-zoom-v1'));if(z>=10&&z<=200)setZoom(z)}catch(e){}$('angleInput').onchange=e=>setAngle(Number(e.target.value));$('angleRange').oninput=e=>setAngle(Number(e.target.value));document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>setAngle(angle+Number(b.dataset.step)));$('bounces').oninput=e=>{bounces=clamp(Math.floor(Number(e.target.value)||0),0,200);draw()};$('showBounds').onchange=draw;$('showReverse').onchange=draw;$('reset').onclick=()=>{bounds={x1:.05,y1:.12,x2:.95,y2:.88};source={x:.5,y:.65};saveBounds();draw();status('壁と発射地点を初期化しました。壁の保存内容も更新しました。')};$('save').onclick=()=>{if(!img){status('先に画像を読み込んでください。');return}const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='reflection_result.png';a.click()};draw();})();
</script></body></html>
