:root{color-scheme:dark;font-family:system-ui,'Yu Gothic',sans-serif}*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf2fa}header{padding:12px 18px;border-bottom:1px solid #344155}h1{font-size:19px;margin:0 0 4px}header small{color:#aebbd0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px;height:calc(100dvh - 67px);min-height:450px}.viewer{background:#243145;border:1px solid #41516b;border-radius:10px;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:8px}.viewer canvas{display:block;max-width:none;touch-action:none;cursor:crosshair}.sidebar{background:#1d2a3e;border:1px solid #3a4b63;border-radius:10px;padding:16px;overflow:auto}.group{border-bottom:1px solid #3b4b62;padding-bottom:15px;margin-bottom:15px}.group:last-child{border:0}label{font-size:13px;color:#cad6e8;display:block;margin-bottom:7px}.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:8px 0}button,input{font:inherit}button{background:#30435e;border:1px solid #60728b;border-radius:6px;padding:9px 11px;color:#fff;cursor:pointer}button:hover{background:#415978}button.active{background:#176e50;border-color:#45d59a}button.primary{background:#215d95}button:disabled{opacity:.45;cursor:not-allowed}input[type=number]{background:#111c2d;border:1px solid #64748b;color:white;border-radius:6px;padding:9px;width:105px}input[type=range]{width:100%;accent-color:#fbbf24}input[type=file]{max-width:100%;font-size:12px}.pastezone{border:2px dashed #6e91b6;border-radius:9px;min-height:64px;padding:14px 10px;text-align:center;color:#e0edff;background:#13243b;outline:none;user-select:text;-webkit-user-select:text}.pastezone:focus{border-color:#fbbf24;background:#203755}.pastezone img{max-width:100%;max-height:80px}.hint{color:#a9b9cf;font-size:12px;line-height:1.6}.value{font-size:23px;font-weight:700;color:#facc15}.status{font-size:12px;color:#b5c8de;line-height:1.6;white-space:pre-wrap}.field{margin:12px 0}.angle-buttons butto (()=>{'use strict';const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d'),viewer=$('viewer');let img=null,mode='source',zoom=0.55,drag=null,aimPointer=null,aimStart=null,obstacleStart=null,obstacleHover=null;let sourceFingerOffset=false;const SOURCE_FINGER_OFFSET_PX=80;let obstacles=[];let bounds={x1:.05,y1:.12,x2:.95,y2:.88},source={x:.5,y:.65};const STORAGE_KEY='reflection-wall-bounds-v1',OBSTACLE_KEY='reflection-obstacles-v1',LOCK_KEY='reflection-zoom-lock-v1',WALL_LOCK_KEY='reflection-wall-lock-v1';function saveObstacles(){try{localStorage.setItem(OBSTACLE_KEY,JSON.stringify(obstacles))}catch(e){}}function refreshObstacleCount(){$('obstacleCount').textContent='内部反射線：'+obstacles.length+'本'+(obstacleStart?'（終点を選択中）':'')}function restoreObstacles(){try{const v=JSON.parse(localStorage.getItem(OBSTACLE_KEY));if(Array.isArray(v))obstacles=v.filter(seg=>Array.isArray(seg)&&seg.length===2&&seg.every(p=>p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&p.x>=0&&p.x<=1&&p.y>=0&&p.y<=1)).slice(0,100)}catch(e){}}restoreObstacles();function saveBounds(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(bounds))}catch(e){status('壁の保存ができません。ブラウザの保存設定を確認してください。')}}function restoreBounds(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved&&['x1','y1','x2','y2'].every(k=>typeof saved[k]==='number'&&Number.isFinite(saved[k])&&saved[k]>=0&&saved[k]<=1))bounds=saved}catch(e){}}restoreBounds();let angle=45,bounces=8;

function updateSize(){if(!img)return;c.width=img.naturalWidth;c.height=img.naturalHeight;c.style.width=(c.width*zoom)+'px';c.style.height=(c.height*zoom)+'px';refreshWallCoords();draw()}

function makeObstacle(center){

function load(file){if(!file||!file.type.startsWith('image/')){status('画像ファイルを選択してください。');return}const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{img=im;URL.revokeObjectURL(url);// 読み込み時は端末の表示幅に収まる倍率を自動選択する。

function draw(){const w=c.width,h=c.height;ctx.clearRect(0,0,w,h);if(img)ctx.drawImage(img,0,0,w,h);else{ctx.fillStyle='#263448';ctx.fillRect(0,0,w,h);ctx.fillStyle='#d5e0ee';ctx.font='22px sans-serif';ctx.fillText('画像を読み込んでください',25,50);return}const a=pos({x:Math.min(bounds.x1,bounds.x2),y:Math.min(bounds.y1,bounds.y2)}),b=pos({x:Math.max(bounds.x1,bounds.x2),y:Math.max(bounds.y1,bounds.y2)}),s=pos(source);if($('showBounds').checked){ctx.strokeStyle='#39a3ff';ctx.lineWidth=Math.max(2,w/500);ctx.setLineDash([Math.max(6,w/100),Math.max(4,w/150)]);ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.setLineDash([]);dot(a.x,a.y,'#39a3ff',Math.max(5,w/180));dot(b.x,b.y,'#39a3ff',Math.max(5,w/180))}dot(s.x,s.y,'#30d99a',Math.max(9,w/110));if(b.x-a.x<2||b.y-a.y<2)return;// 光線と外周4辺・内部線分のうち、最初に衝突する線を選ぶ。

let x=clamp(s.x,a.x,b.x),y=clamp(s.y,a.y,b.y);const rad=angle*Math.PI/180;let vx=Math.cos(rad),vy=-Math.sin(rad);let lastHit=-1;

 if(dirY>1e-10)times.push((h-hitY)/dirY);

for(let i=0;i<=bounces;i++){

 if(i===0&&best.j<4)drawFirstBounceExtension(nx,ny,vx,vy);
 x=nx;y=ny;
 const norm=Math.hypot(best.sx,best.sy);const nxWall=-best.sy/norm,nyWall=best.sx/norm;
 const dotprod=vx*nxWall+vy*nyWall;
 vx-=2*dotprod*nxWall;vy-=2*dotprod*nyWall;
 // わずかに反射方向へずらし、同じ線との二重衝突を避ける。
 x+=vx*0.0001;y+=vy*0.0001;
}

if(aimPointer&&aimStart){ctx.save();ctx.lineWidth=Math.max(2,w/400);ctx.setLineDash([Math.max(5,w/160),Math.max(4,w/200)]);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.moveTo(aimPointer.x*w,aimPointer.y*h);ctx.lineTo(aimStart.x*w,aimStart.y*h);ctx.stroke();ctx.setLineDash([]);dot(aimStart.x*w,aimStart.y*h,'#ffda55',Math.max(4,w/230));dot(aimPointer.x*w,aimPointer.y*h,'#a5b4fc',Math.max(4,w/230));ctx.restore()}
if($('showReverse').checked){
  // 反対側は反射させず、画像の端まで一直線に延長する。
  const rx=-Math.cos(rad),ry=Math.sin(rad);
  const ox=s.x,oy=s.y;
  const times=[];
  if(rx>1e-10)times.push((w-ox)/rx);
  if(rx< -1e-10)times.push((0-ox)/rx);
  if(ry>1e-10)times.push((h-oy)/ry);
  if(ry< -1e-10)times.push((0-oy)/ry);
  const tEnd=Math.min(...times.filter(t=>t>=0));
  if(Number.isFinite(tEnd)){
    ctx.save();ctx.globalAlpha=0.5;
    ctx.strokeStyle='#ffb347';ctx.lineWidth=Math.max(2,w/250);
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+rx*tEnd,oy+ry*tEnd);ctx.stroke();

  }

}
function setAngle(n){if(!Number.isFinite(n))return;angle=Math.round((((n%360)+360)%360)*20)/20;if(angle>=360)angle=0;$('angleLabel').textContent=angle.toFixed(2)+'°';draw()}
$('file').addEventListener('change',e=>load(e.target.files[0]));document.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(item){e.preventDefault();load(item.getAsFile())}});$('paste').onclick=async()=>{try{const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type){load(await item.getType(type));return}}status('クリップボードに画像がありません。Ctrl + Vも試してください。')}catch(e){status('ブラウザが直接貼り付けを許可していません。Ctrl + Vを試してください。')}};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));function updateAim(p){if(!aimStart)return;aimPointer=p;const dx=(aimStart.x-p.x)*c.width,dy=(p.y-aimStart.y)*c.height;if(Math.hypot(dx,dy)<2){draw();return}setAngle(Math.atan2(dy,dx)*180/Math.PI)}
// iPhone / Android: 2本指のピンチズームとパン。1本指は従来の編集操作。
const fingers=new Map();let gesture=null,preTouch=null,suppressTouch=false;
function gestureMetrics(){const a=[...fingers.values()];return {mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}}
function beginGesture(){

 if(preTouch){bounds={...preTouch.bounds};source={...preTouch.source};angle=preTouch.angle;obstacles=preTouch.obstacles.map(seg=>seg.map(p=>({...p})));$('angleLabel').textContent=angle.toFixed(2)+'°';refreshObstacleCount();refreshWallCoords();draw()}

 gesture={zoomStart:zoom,distStart:Math.max(1,m.dist),imageX:(m.mx-rect.left)/rect.width,imageY:(m.my-rect.top)/rect.height};

function moveGesture(){if(!gesture||fingers.size<2)return;const m=gestureMetrics();const locked=$('zoomLock').checked;
 const target=locked?zoom:clamp(gesture.zoomStart*m.dist/gesture.distStart,0.10,2);
 if(Math.abs(target-zoom)>0.00001){setZoom(target*100)}

 const r=c.getBoundingClientRect();viewer.scrollLeft+=r.left+gesture.imageX*r.width-m.mx;viewer.scrollTop+=r.top+gesture.imageY*r.height-m.my;
}
c.addEventListener('pointerdown',e=>{
 if(!img)return;
 if(e.pointerType==='touch'){
   fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});c.setPointerCapture(e.pointerId);
   if(fingers.size===1){suppressTouch=false;preTouch={bounds:{...bounds},source:{...source},angle,obstacles:obstacles.map(seg=>seg.map(p=>({...p})))}}

   if(fingers.size>2)return;

 if(gesture||suppressTouch)return;

 // 発射地点の丸を直接つかめば、選択中のモードにかかわらず移動できる。
 // 指でつかみやすいよう、画面上の判定半径を描画サイズより広くする。
 const sourceHitRadius=Math.max(26,Math.min(46,c.width*zoom/110+12));
 const sourceDistance=Math.hypot((source.x-p.x)*c.width*zoom,(source.y-p.y)*c.height*zoom);
 if(sourceDistance<=sourceHitRadius){drag='source';sourceFingerOffset=e.pointerType==='touch';c.setPointerCapture(e.pointerId);if(sourceFingerOffset){movePoint(sourceOffsetPoint(e))}else{movePoint(p)}return}
 if((mode==='wall1'||mode==='wall2')&&$('wallLock').checked){status('壁の座標が固定されています。固定を解除してから編集してください。');return}
 if(mode==='aim'){drag='aim';aimStart=p;aimPointer=p;c.setPointerCapture(e.pointerId);draw();return}
 if((mode==='obstacle-horizontal'||mode==='obstacle-vertical')){obstacles.push(makeObstacle(p));obstacleHover=p;saveObstacles();refreshObstacleCount();draw();status('内部反射線を追加しました（'+obstacles.length+'本）。');return}
 const candidates=[['wall1',{x:bounds.x1,y:bounds.y1}],['wall2',{x:bounds.x2,y:bounds.y2}],['source',source]];
 let near=candidates.map(([name,q])=>({name,d:Math.hypot((q.x-p.x)*c.width,(q.y-p.y)*c.height)*zoom})).sort((a,b)=>a.d-b.d)[0];
 drag=near.d<18?near.name:mode;if($('wallLock').checked&&(drag==='wall1'||drag==='wall2'))drag=mode==='source'?'source':null;

});
function sourceOffsetPoint(e){const r=c.getBoundingClientRect();return {x:clamp((e.clientX-r.left-SOURCE_FINGER_OFFSET_PX)/r.width,0,1),y:clamp((e.clientY-r.top-SOURCE_FINGER_OFFSET_PX)/r.height,0,1)}}
function movePoint(p){if((drag==='wall1'||drag==='wall2')&&$('wallLock').checked)return;if(drag==='wall1'){bounds.x1=p.x;bounds.y1=p.y}else if(drag==='wall2'){bounds.x2=p.x;bounds.y2=p.y}else if(drag==='source'){source={...p}}refreshWallCoords();draw()}
c.addEventListener('pointermove',e=>{
 if(e.pointerType==='touch'&&fingers.has(e.pointerId)){
   fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
   if(gesture){if(fingers.size>=2)moveGesture();return}
   if(suppressTouch)return;
 }
 if((mode==='obstacle-horizontal'||mode==='obstacle-vertical')&&!drag){obstacleHover=point(e);draw()}else if(drag==='aim')updateAim(point(e));else if(drag)movePoint(drag==='source'&&sourceFingerOffset?sourceOffsetPoint(e):point(e));
});
c.addEventListener('pointerleave',()=>{if((mode==='obstacle-horizontal'||mode==='obstacle-vertical')&&!gesture){obstacleHover=null;draw()}});
function endDrag(){if(drag==='wall1'||drag==='wall2')saveBounds();drag=null;sourceFingerOffset=false;aimPointer=null;aimStart=null;draw()}
function endPointer(e){if(e.pointerType==='touch'){
  const wasGesture=!!gesture;fingers.delete(e.pointerId);
  if(wasGesture){gesture=null;drag=null;sourceFingerOffset=false;aimPointer=null;aimStart=null;draw();if(fingers.size===0){suppressTouch=false;preTouch=null}return}
  if(suppressTouch){if(fingers.size===0){suppressTouch=false;preTouch=null}return}
  preTouch=null;
 }
 endDrag();
}
c.addEventListener('pointerup',endPointer);c.addEventListener('pointercancel',endPointer);
function refreshWallCoords(){if(typeof refreshDevicePresetButtons==='function')refreshDevicePresetButtons();for(const [id,key] of [['wallX1','x1'],['wallY1','y1'],['wallX2','x2'],['wallY2','y2']]){if(document.activeElement!==$(id))$(id).value=(bounds[key]*100).toFixed(2)}if(img){$('wallPx1').textContent=`画像内: (${Math.round(bounds.x1*c.width)}, ${Math.round(bounds.y1*c.height)}) px / ${c.width}×${c.height}`;$('wallPx2').textContent=`画像内: (${Math.round(bounds.x2*c.width)}, ${Math.round(bounds.y2*c.height)}) px / ${c.width}×${c.height}`}else{$('wallPx1').textContent='画像を読み込むとpx座標を表示';$('wallPx2').textContent='画像を読み込むとpx座標を表示'}}
function applyWallLock(){const locked=$('wallLock').checked;['wallX1','wallY1','wallX2','wallY2','saveWallCoords'].forEach(id=>$(id).disabled=locked);try{localStorage.setItem(WALL_LOCK_KEY,locked?'1':'0')}catch(e){}if(locked&&(mode==='wall1'||mode==='wall2'))setMode('source')}
try{$('wallLock').checked=localStorage.getItem(WALL_LOCK_KEY)==='1'}catch(e){}$('wallLock').onchange=applyWallLock;applyWallLock();
const DEVICE_WALL_PRESETS={iphone16:{label:'iPhone 16',bounds:{x1:0.0435,y1:0.1912,x2:0.9562,y2:0.6715}},iphoneSE2:{label:'iPhone SE2',bounds:{x1:0.0413,y1:0.1253,x2:0.9606,y2:0.7080}}};
function refreshDevicePresetButtons(){for(const [key,id] of [['iphone16','presetIPhone16'],['iphoneSE2','presetIPhoneSE2']]){const preset=DEVICE_WALL_PRESETS[key].bounds;const same=['x1','y1','x2','y2'].every(k=>Math.abs(bounds[k]-preset[k])<0.000001);$(id).classList.toggle('active',same);$(id).setAttribute('aria-pressed',same?'true':'false')}}
function applyDevicePreset(key){const preset=DEVICE_WALL_PRESETS[key];bounds={...preset.bounds};saveBounds();$('wallLock').checked=true;applyWallLock();refreshWallCoords();refreshDevicePresetButtons();draw();status(preset.label+' の壁座標を保存して固定しました。')} 
$('presetIPhone16').onclick=()=>applyDevicePreset('iphone16');
$('presetIPhoneSE2').onclick=()=>applyDevicePreset('iphoneSE2');
refreshDevicePresetButtons();
$('saveWallCoords').onclick=()=>{if($('wallLock').checked)return;const vals=['wallX1','wallY1','wallX2','wallY2'].map(id=>Number($(id).value));if(vals.some(v=>!Number.isFinite(v)||v<0||v>100)){status('座標は0〜100%で指定してください。');return}const [x1,y1,x2,y2]=vals.map(v=>v/100);if(x1>=x2||y1>=y2){status('左上のX・Yは右下より小さくしてください。');return}bounds={x1,y1,x2,y2};saveBounds();refreshWallCoords();draw();status('壁の座標を保存しました。固定する場合はチェックを入れてください。')};
$('copyWallCoords').onclick=async()=>{const t=`左上: X=${(bounds.x1*100).toFixed(2)}%, Y=${(bounds.y1*100).toFixed(2)}%\n右下: X=${(bounds.x2*100).toFixed(2)}%, Y=${(bounds.y2*100).toFixed(2)}%` ;try{await navigator.clipboard.writeText(t);status('壁の座標をコピーしました。')}catch(e){status(t)}};
refreshWallCoords();
$('obstacleLength').oninput=e=>setObstacleLength(e.target.value);$('obstacleLengthInput').onchange=e=>setObstacleLength(e.target.value);$('obstacleLengthMinus').onclick=()=>setObstacleLength(Number($('obstacleLengthInput').value)-1);$('obstacleLengthPlus').onclick=()=>setObstacleLength(Number($('obstacleLengthInput').value)+1);function applyZoomLock(){const locked=$('zoomLock').checked;['zoomRange','zoomInput','zoomMinus','zoomPlus','zoomFit','zoomReset'].forEach(id=>$(id).disabled=locked);try{localStorage.setItem(LOCK_KEY,locked?'1':'0')}catch(e){}}$('zoomLock').onchange=applyZoomLock;try{$('zoomLock').checked=localStorage.getItem(LOCK_KEY)==='1'}catch(e){}applyZoomLock();$('zoomMinus').onclick=()=>setZoom(Math.round(zoom*100)-1);$('zoomPlus').onclick=()=>setZoom(Math.round(zoom*100)+1);$('zoomRange').oninput=e=>setZoom(e.target.value);$('zoomInput').onchange=e=>setZoom(e.target.value);$('zoomReset').onclick=()=>setZoom(55);$('zoomFit').onclick=()=>{if(!img)return;const r=viewer.getBoundingClientRect();setZoom(Math.floor(Math.min((r.width-24)/img.naturalWidth,(r.height-24)/img.naturalHeight)*100))};try{const z=Number(localStorage.getItem('reflection-zoom-v1'));if(z>=10&&z<=200)setZoom(z)}catch(e){}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>setAngle(angle+Number(b.dataset.step)));function setBounces(v){bounces=clamp(Math.floor(Number(v)||0),0,200);$('bounces').value=bounces;draw()}$('bounces').oninput=e=>setBounces(e.target.value);$('bounceMinus').onclick=()=>setBounces(bounces-1);$('bouncePlus').onclick=()=>setBounces(bounces+1);$('undoObstacle').onclick=()=>{obstacles.pop();saveObstacles();refreshObstacleCount();draw()};$('clearObstacles').onclick=()=>{obstacles=[];obstacleStart=null;saveObstacles();refreshObstacleCount();draw()};$('showBounds').onchange=draw;$('showReverse').onchange=draw;$('reset').onclick=()=>{bounds={x1:.05,y1:.12,x2:.95,y2:.88};source={x:.5,y:.65};saveBounds();refreshWallCoords();draw();status('壁と発射地点を初期化しました。壁の保存内容も更新し
